# The Xcode project of untype for iPhone and iPad. The .xcodeproj is not kept
# in git: generate it with `xcodegen generate` in this folder (see README.md).
name: untype-ios
options:
  bundleIdPrefix: com.biks2013
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  untype-s:
    path: ..
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: 9F9H8NCAUB
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "4"
targets:
  untype:
    type: application
    platform: iOS
    sources:
      - path: UntypeApp
    # Merged with the generated keys below: recording goes on with the screen
    # locked, and the saved meetings are visible in the Files app.
    info:
      path: UntypeApp/Info.plist
      properties:
        UIBackgroundModes: [audio]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    dependencies:
      - package: untype-s
        product: UntypeCore
      - target: UntypeControls
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.biks2013.untype
        PRODUCT_NAME: untype
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: untype
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "untype listens to the microphone to write what you say."
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
  # The Control Center button "Record meeting" (iOS 18 controls).
  UntypeControls:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: UntypeControls
      - path: UntypeApp/RecordMeetingIntent.swift
    info:
      path: UntypeControls/Info.plist
      properties:
        CFBundleDisplayName: untype
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.biks2013.untype.controls
        PRODUCT_NAME: UntypeControls
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
schemes:
  untype:
    build:
      targets:
        untype: all
    run:
      config: Debug
    archive:
      config: Release
